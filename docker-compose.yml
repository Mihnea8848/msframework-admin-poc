services:
  db:
    image: postgres:16
    container_name: msframework_db
    environment:
      POSTGRES_DB: msframework
      POSTGRES_USER: msframework
      POSTGRES_PASSWORD: msframework
    ports:
      - "5433:5432"
    volumes:
      - msframework_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msframework -d msframework"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  msframework_pgdata:
