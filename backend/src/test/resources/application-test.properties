# Tests run against an in-memory H2 database in PostgreSQL mode, so no database server is needed.
spring.datasource.url=jdbc:h2:mem:msframework;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=KEY,VALUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
logging.level.org.hibernate.SQL=off
