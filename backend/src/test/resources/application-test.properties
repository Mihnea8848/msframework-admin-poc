# Integration tests run on PostgreSQL 16. By default Testcontainers starts one (see
# TestcontainersConfiguration) and overrides the connection below. Without Docker, point the
# tests at any PostgreSQL 16 database whose contents you can lose:
#   TEST_DB_URL=jdbc:postgresql://localhost:5433/msframework_test ./mvnw verify
# The schema comes from the Flyway migrations, as in production. Because TEST_DB_URL may point
# at a database left over from an earlier run, the tests run Flyway clean before migrating
# (TestcontainersConfiguration), so clean is allowed in this profile only. MigrationTests also
# create and drop extra databases (msf_mig_*), so the user needs CREATEDB.
spring.datasource.url=${TEST_DB_URL:}
spring.datasource.username=${TEST_DB_USERNAME:msframework}
spring.datasource.password=${TEST_DB_PASSWORD:msframework}
spring.flyway.clean-disabled=false

# The throttle limits are high here so tests that sign in often never hit them;
# AuthThrottleTests lowers them for its own requests.
app.throttle.login.limit=100000
app.throttle.forgot-password.limit=100000
app.throttle.reset-password.limit=100000
app.throttle.register.limit=100000
app.throttle.lockout.max-failures=100000

# No demo data in tests; PeopleApiTests runs DemoPeopleSeeder explicitly.
app.seed.demo=false
app.seed.staff=false

# Query counts for the N+1 check in PeopleApiTests (the per-session summary log stays quiet).
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
