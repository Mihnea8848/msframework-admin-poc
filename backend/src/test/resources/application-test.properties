# Integration tests run on PostgreSQL 16. By default Testcontainers starts one (see
# TestcontainersConfiguration) and overrides the connection below. Without Docker, point the
# tests at any PostgreSQL 16 database you can drop and recreate:
#   TEST_DB_URL=jdbc:postgresql://localhost:5433/msframework_test ./mvnw verify
spring.datasource.url=${TEST_DB_URL:}
spring.datasource.username=${TEST_DB_USERNAME:msframework}
spring.datasource.password=${TEST_DB_PASSWORD:msframework}
spring.jpa.hibernate.ddl-auto=create-drop
