server.port=${SERVER_PORT:8080}

# PostgreSQL (matches docker-compose.yml). Override with DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/msframework}
spring.datasource.username=${DB_USERNAME:msframework}
spring.datasource.password=${DB_PASSWORD:msframework}

# Schema is managed by Flyway (src/main/resources/db/migration); Hibernate only validates it.
# Databases created before Flyway are baselined by config/FlywayConfig (never blindly).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# Session cookie: HTTP-only and SameSite=Lax so other sites cannot ride the session (CSRF).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# Base URL of the frontend, used to build password-reset links.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Default admin account, created only when the users table is empty.
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@test.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:password123}

spring.main.banner-mode=off

# Application version, copied from pom.xml at build time (shown in the OpenAPI description).
app.version=@project.version@

# OpenAPI description (springdoc), served without login at /v3/api-docs. No Swagger UI is bundled.
# Set API_DOCS_ENABLED=false to switch it off (production). api/openapi.json is the committed copy.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.writer-with-order-by-keys=true
springdoc.default-produces-media-type=application/json

# Demo data for a fresh install (people, budgets, expenses, goals). Each demo seeder runs once per
# database (a marker row in org_settings). Set SEED_DEMO_DATA=false for a clean production start.
app.seed.demo=${SEED_DEMO_DATA:true}

# Business domain: the organisation's one currency (ISO 4217; amounts are never converted) and the
# per-API-key request limit of POST /api/ingest/checkins.
app.finance.currency=${FINANCE_CURRENCY:EUR}
app.ingest.requests-per-minute=${INGEST_REQUESTS_PER_MINUTE:60}
