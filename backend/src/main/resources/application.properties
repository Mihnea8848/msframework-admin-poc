server.port=${SERVER_PORT:8080}

# PostgreSQL (matches docker-compose.yml). Override with DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/msframework}
spring.datasource.username=${DB_USERNAME:msframework}
spring.datasource.password=${DB_PASSWORD:msframework}

# Schema is managed by Flyway (src/main/resources/db/migration); Hibernate only validates it.
# Databases created before Flyway are baselined by config/FlywayConfig (never blindly).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# Sessions are stored in PostgreSQL (Spring Session JDBC), so they survive restarts and are
# shared by every instance. Flyway creates the tables (V4); Spring Session must not.
# The session ends after SESSION_TIMEOUT without user activity; background polls
# (X-Background-Request: 1) do not count as activity.
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
# Session cookie (named SESSION): HTTP-only and SameSite=Lax. CSRF tokens protect the rest.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Client IP for throttling and the sessions list. Only when the backend is reachable through
# exactly one trusted reverse proxy, set TRUSTED_PROXY=true to use the address that proxy
# appended to X-Forwarded-For; otherwise the header is ignored, because clients can forge it.
app.security.trusted-proxy=${TRUSTED_PROXY:false}

# Throttling of the public auth endpoints (database-backed, so it holds across instances).
# Each rule allows <limit> requests per client IP per <window>; over it the answer is 429.
app.throttle.login.limit=20
app.throttle.login.window=1m
app.throttle.forgot-password.limit=5
app.throttle.forgot-password.window=15m
app.throttle.reset-password.limit=10
app.throttle.reset-password.window=15m
app.throttle.register.limit=10
app.throttle.register.window=1h
# <max-failures> failed sign-ins for one account within <window> lock it for <duration>.
app.throttle.lockout.max-failures=5
app.throttle.lockout.window=15m
app.throttle.lockout.duration=15m

# Base URL of the frontend, used to build password-reset links.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Default admin account, created only when the users table is empty.
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@test.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:password123}

spring.main.banner-mode=off

# Application version, copied from pom.xml at build time (shown in the OpenAPI description).
app.version=@project.version@

# OpenAPI description (springdoc), served without login at /v3/api-docs. No Swagger UI is bundled.
# Set API_DOCS_ENABLED=false to switch it off (production). api/openapi.json is the committed copy.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.writer-with-order-by-keys=true
springdoc.default-produces-media-type=application/json
